<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz żeglarski – Podsumowanie Sezonu 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0F2A43;color:#F4F1EA;font-family:Inter,Arial,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Space Grotesk',Arial,sans-serif;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 90px}
.host .wrap{max-width:1500px;padding:40px 56px 100px}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#F09A5E;margin:0 0 10px}
.host .eyebrow{font-size:22px}
.big{font-size:clamp(28px,5vw,56px);line-height:1.1;font-weight:700}
.host .big{font-size:60px}
.sub{color:#C9D6E2;font-size:18px;line-height:1.4;margin:12px 0 0}
.host .sub{font-size:28px}
button,input{font:inherit}
.btn{background:#E8742B;color:#0F2A43;border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:18px;cursor:pointer}
.btn.ghost{background:#17395A;color:#F4F1EA}
input.name{width:100%;padding:16px;border-radius:12px;border:2px solid #4A6A8A;background:#17395A;color:#F4F1EA;font-size:20px;margin:18px 0}
.opts{display:grid;gap:14px;margin-top:26px;grid-template-columns:1fr}
.host .opts{grid-template-columns:1fr 1fr;gap:22px}
.opt{position:relative;text-align:left;background:#17395A;color:#F4F1EA;border:3px solid #17395A;border-radius:16px;padding:20px 20px 20px 70px;font-size:20px;line-height:1.3;cursor:pointer;overflow:hidden;min-height:72px}
.host .opt{font-size:30px;padding:28px 28px 28px 92px;cursor:default;min-height:110px}
.opt .l{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:#F4F1EA;color:#0F2A43;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:20px}
.host .opt .l{left:24px;width:52px;height:52px;font-size:26px}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:#2C5C8A;opacity:.55;z-index:0;transition:width .4s}
.opt .t,.opt .n{position:relative;z-index:1}
.opt .n{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-weight:700;font-size:26px}
.opt.good{border-color:#6FD08C;background:#1D5A3A}
.opt.mine{border-color:#F09A5E}
.opt.dim{opacity:.55}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{background:#17395A;border-radius:999px;padding:8px 16px;font-size:18px}
.host .chip{font-size:26px;padding:10px 22px}
.timer{font-family:'Space Grotesk',Arial,sans-serif;font-size:56px;font-weight:700;color:#F09A5E}
.board{margin-top:24px;display:grid;gap:10px}
.rowb{display:flex;justify-content:space-between;background:#17395A;border-radius:12px;padding:14px 20px;font-size:20px}
.host .rowb{font-size:32px;padding:18px 28px}
.rowb.me{border:2px solid #F09A5E}
.qr{background:#fff;padding:18px;border-radius:16px;display:inline-block}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:start;margin-top:30px}
.ctl{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;background:#0b1e31;padding:8px;border-radius:14px;opacity:.9}
.ctl .btn{font-size:15px;padding:10px 14px}
.msg{background:#17395A;border-radius:16px;padding:24px;font-size:20px;line-height:1.5;margin-top:24px}
.stats{margin-top:28px;display:grid;gap:12px}
.sb{display:grid;grid-template-columns:230px 1fr 60px;align-items:center;gap:16px;font-size:26px}
.st{background:#17395A;border-radius:10px;height:34px;overflow:hidden;display:block}
.sf{display:block;height:100%}
.sn{font-weight:700}
.ok{color:#6FD08C;font-weight:700}.bad{color:#FF9A8A;font-weight:700}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@400;600&display=swap">
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var TIME=20;
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbz4e9oBETSZ1E2W5HgDCMPa7KP2Uzk7VcQupOLNoCw4yFNaVEXits1yqmRA9E-XT5jb/exec";
var Q=[
 {q:"Dopuszczalna masa łódki klasy Omega startującej w AMP to",o:["230 kg", "250 kg", "280 kg", "300 kg"],c:1},
 {q:"Zwycięzcą Ekstraklasy PLŻ w sezonie 2026 był klub",o:["YKP Gdyni", "HRM Racing", "Legia Warszawa", "YC Gdańsk"],c:3},
 {q:"Które miejsce w klasyfikacji sterników na AMP 2026 zajęła najlepsza załoga z Politechniki Gdańskiej?",o:["1", "2", "3", "4"],c:1},
 {q:"W jakiej klasie rozgrywano tegoroczne AMŚ w żeglarstwie?",o:["RS 21", "Dolphin 21", "Melges 20", "Melges 24"],c:2},
 {q:"Ile załóg wystawiła Politechnika Gdańska na AMP w 2026 roku?",o:["6", "5", "4", "3"],c:0},
 {q:"Wiatr wieje z prędkością 10 węzłów. Ile to w przybliżeniu m/s?",o:["10 m/s", "18 m/s", "5 m/s", "3 m/s"],c:2},
 {q:"Jak nazywa się poziomy drzewiec, do którego mocuje się dolny liek grota?",o:["Maszt", "Salingi", "Reling", "Bom"],c:3},
 {q:"Ile razy załoga POL 377 z PG stanęła na podium w siedmiu rundach PP klasy Omega 2026 (łącznie z Mistrzostwami Polski)?",o:["4", "2", "3", "5"],c:0},
 {q:"W którym z miejsc nie odbyły się regaty Młodzieżowej PLŻ w 2026 roku?",o:["Sopot", "Puck", "Gdynia", "Szczecin"],c:1}
];
var LET=["A","B","C","D"];
var app=document.getElementById("app"),i=0,pts=0,good=0,sel=-1,left=TIME,tm=null,t0=0,name="";
try{name=localStorage.getItem("qn")||""}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pageUrl(){return location.href.split("#")[0]}
function show(h){app.innerHTML='<div class="wrap">'+h+'</div>'}
function intro(){show('<p class="eyebrow">Quiz żeglarski · Podsumowanie Sezonu 2026</p><h1 class="big">Zagraj na telefonie</h1><p class="sub">'+Q.length+' pytań w blokach po dwa, '+TIME+' sekund na każde. Im szybciej odpowiesz poprawnie, tym więcej punktów. Bez logowania. Wynik trafi na ekran główny.</p><input class="name" id="nm" maxlength="20" placeholder="Twój pseudonim" value="'+esc(name)+'"><button class="btn" id="go">Start</button>');document.getElementById("go").onclick=start}
var open=0,wt=null;
function poll(cb){try{fetch(SCRIPT_URL+"?t="+Date.now()).then(function(r){return r.json()}).then(function(d){open=Number(d.open)||0;if(cb)cb()}).catch(function(){if(cb)cb()})}catch(e){if(cb)cb()}}
function start(){var v=document.getElementById("nm").value.trim().slice(0,20);if(!v){document.getElementById("nm").focus();return}name=v;try{localStorage.setItem("qn",name)}catch(e){}i=0;pts=0;good=0;poll(next)}
function next(){clearInterval(wt);if(i>=Q.length){fin();return}if(i>=open)wait();else ask()}
function wait(){if(i>0)send();show('<p class="eyebrow">'+(i===0?'Jesteś w grze':'Przerwa w quizie')+'</p><h1 class="big">'+(i===0?'Czekamy na start':'Wracamy do prezentacji')+'</h1><div class="msg">'+(i===0?'Prowadzący uruchomi pierwsze pytania.':'Masz '+pts+' pkt. Kolejne pytania pojawią się tutaj same.')+' Nie zamykaj tej strony.</div>');clearInterval(wt);wt=setInterval(function(){poll(function(){if(i<open)next()})},3000)}
function ask(){sel=-1;left=TIME;t0=Date.now();var q=Q[i],h='<p class="eyebrow">Pytanie '+(i+1)+' z '+Q.length+'</p><div class="timer" id="tm">'+TIME+' s</div><h1 class="big" style="font-size:clamp(22px,4.5vw,36px)">'+esc(q.q)+'</h1><div class="opts">';
 for(var k=0;k<4;k++)h+='<button class="opt" data-i="'+k+'"><span class="l">'+LET[k]+'</span><span class="t">'+esc(q.o[k])+'</span></button>';
 show(h+'</div>');
 Array.prototype.forEach.call(document.querySelectorAll("button.opt"),function(b){b.onclick=function(){pick(+b.getAttribute("data-i"))}});
 clearInterval(tm);tm=setInterval(function(){left=Math.max(0,TIME-Math.floor((Date.now()-t0)/1000));var e=document.getElementById("tm");if(e)e.textContent=left+" s";if(left<=0)pick(-1)},250)}
function pick(k){clearInterval(tm);var q=Q[i],el=(Date.now()-t0)/1000,ok=k===q.c,gain=ok?500+Math.round(500*Math.max(0,1-el/TIME)):0;if(ok)good++;pts+=gain;
 var h='<p class="eyebrow">Pytanie '+(i+1)+' z '+Q.length+'</p><h1 class="big" style="font-size:clamp(22px,4.5vw,36px)">'+esc(q.q)+'</h1><div class="opts">';
 for(var j=0;j<4;j++){var c="opt "+(j===q.c?"good":"dim");if(j===k)c+=" mine";h+='<div class="'+c+'"><span class="l">'+LET[j]+'</span><span class="t">'+esc(q.o[j])+'</span></div>'}
 h+='</div><div class="msg">'+(k<0?'<span class="bad">Czas minął.</span>':ok?'<span class="ok">Dobrze!</span>':'<span class="bad">Niestety, źle.</span>')+' +'+gain+' pkt, razem '+pts+' pkt.</div><p><button class="btn" id="nx" style="margin-top:20px">'+(i+1>=Q.length?"Zobacz wynik":"Dalej")+'</button></p>';
 show(h);document.getElementById("nx").onclick=function(){i++;next()}}
function send(){if(SCRIPT_URL.indexOf("http")!==0)return;try{fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:name,pts:pts,good:good})})}catch(e){}}
function fin(){send();show('<p class="eyebrow">Koniec quizu</p><h1 class="big">'+(name?esc(name)+', twój wynik: ':'Twój wynik: ')+pts+' pkt</h1><div class="msg">Poprawnych odpowiedzi: '+good+' z '+Q.length+'. Dziękujemy za grę!</div><p><button class="btn ghost" id="again" style="margin-top:20px">Zagraj jeszcze raz</button></p>');document.getElementById("again").onclick=intro}
function qrPage(){document.body.className="host";show('<p class="eyebrow">Quiz żeglarski · Podsumowanie Sezonu 2026</p><h1 class="big">Zeskanuj i zagraj</h1><div class="lobby"><div><div class="qr" id="qr"></div></div><div><p class="sub">Aparat telefonu otwiera quiz bez logowania. Wpisz pseudonim i odpowiadaj na pytania.</p><p class="sub">'+esc(pageUrl())+'</p></div></div>');if(window.QRCode)new QRCode(document.getElementById("qr"),{text:pageUrl(),width:380,height:380,correctLevel:QRCode.CorrectLevel.M})}
if(location.hash==="#qr")qrPage();else intro();
</script>
</body>
</html>
