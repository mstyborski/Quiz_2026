<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz żeglarski – Podsumowanie Sezonu 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0F2A43;color:#F4F1EA;font-family:Inter,Arial,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Space Grotesk',Arial,sans-serif;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 90px}
.host .wrap{max-width:1500px;padding:40px 56px 100px}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#F09A5E;margin:0 0 10px}
.host .eyebrow{font-size:22px}
.big{font-size:clamp(28px,5vw,56px);line-height:1.1;font-weight:700}
.host .big{font-size:60px}
.sub{color:#C9D6E2;font-size:18px;line-height:1.4;margin:12px 0 0}
.host .sub{font-size:28px}
button,input{font:inherit}
.btn{background:#E8742B;color:#0F2A43;border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:18px;cursor:pointer}
.btn.ghost{background:#17395A;color:#F4F1EA}
input.name{width:100%;padding:16px;border-radius:12px;border:2px solid #4A6A8A;background:#17395A;color:#F4F1EA;font-size:20px;margin:18px 0}
.opts{display:grid;gap:14px;margin-top:26px;grid-template-columns:1fr}
.host .opts{grid-template-columns:1fr 1fr;gap:22px}
.opt{position:relative;text-align:left;background:#17395A;color:#F4F1EA;border:3px solid #17395A;border-radius:16px;padding:20px 20px 20px 70px;font-size:20px;line-height:1.3;cursor:pointer;overflow:hidden;min-height:72px}
.host .opt{font-size:30px;padding:28px 28px 28px 92px;cursor:default;min-height:110px}
.opt .l{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:#F4F1EA;color:#0F2A43;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:20px}
.host .opt .l{left:24px;width:52px;height:52px;font-size:26px}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:#2C5C8A;opacity:.55;z-index:0;transition:width .4s}
.opt .t,.opt .n{position:relative;z-index:1}
.opt .n{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-weight:700;font-size:26px}
.opt.good{border-color:#6FD08C;background:#1D5A3A}
.opt.mine{border-color:#F09A5E}
.opt.dim{opacity:.55}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{background:#17395A;border-radius:999px;padding:8px 16px;font-size:18px}
.host .chip{font-size:26px;padding:10px 22px}
.timer{font-family:'Space Grotesk',Arial,sans-serif;font-size:56px;font-weight:700;color:#F09A5E}
.board{margin-top:24px;display:grid;gap:10px}
.rowb{display:flex;justify-content:space-between;background:#17395A;border-radius:12px;padding:14px 20px;font-size:20px}
.host .rowb{font-size:32px;padding:18px 28px}
.rowb.me{border:2px solid #F09A5E}
.qr{background:#fff;padding:18px;border-radius:16px;display:inline-block}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:start;margin-top:30px}
.ctl{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;background:#0b1e31;padding:8px;border-radius:14px;opacity:.9}
.ctl .btn{font-size:15px;padding:10px 14px}
.msg{background:#17395A;border-radius:16px;padding:24px;font-size:20px;line-height:1.5;margin-top:24px}
.stats{margin-top:28px;display:grid;gap:12px}
.sb{display:grid;grid-template-columns:230px 1fr 60px;align-items:center;gap:16px;font-size:26px}
.st{background:#17395A;border-radius:10px;height:34px;overflow:hidden;display:block}
.sf{display:block;height:100%}
.sn{font-weight:700}
.ok{color:#6FD08C;font-weight:700}.bad{color:#FF9A8A;font-weight:700}

.tiles{display:grid;gap:14px;margin-top:22px;grid-template-columns:1fr}
.host .tiles{grid-template-columns:1fr 1fr;gap:22px}
.tile{position:relative;border:0;border-radius:16px;padding:22px 20px 22px 76px;font-size:22px;font-weight:700;line-height:1.25;color:#fff;text-align:left;min-height:84px;display:flex;align-items:center;width:100%;cursor:pointer}
.host .tile{font-size:34px;padding:30px 30px 30px 110px;min-height:130px;cursor:default}
.tile .sym{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:40px}
.host .tile .sym{left:32px;font-size:60px}
.tile .cnt{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:34px}
.t0{background:#D6404A}.t1{background:#2F73D9}.t2{background:#C99410;color:#101010}.t3{background:#2E9A57}
.tile.dim{opacity:.35}.tile.pick{outline:5px solid #fff}
.tile:disabled{cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.bigbtn{border:0;border-radius:20px;color:#fff;font-size:72px;font-weight:700;min-height:34vh;cursor:pointer}
.bigbtn:disabled{opacity:.45}
.bigbtn.pick{outline:6px solid #fff}
.bar2{height:14px;background:#17395A;border-radius:8px;margin:14px 0;overflow:hidden}
.bar2 i{display:block;height:100%;background:#E8742B}
.rk{display:grid;grid-template-columns:60px 1fr 140px;gap:16px;align-items:center;margin-top:12px;font-size:22px}
.host .rk{font-size:34px;grid-template-columns:70px 1fr 180px}
.rk .nm{position:relative;background:#17395A;border-radius:10px;padding:10px 16px;overflow:hidden}
.rk .nm i{position:absolute;left:0;top:0;bottom:0;background:#2C5C8A;opacity:.7}
.rk .nm b{position:relative}
.rk .pt{font-weight:700;text-align:right}
.hostbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;background:#0b1e31;padding:10px 16px;flex-wrap:wrap}
.hostbar input{width:110px;padding:10px;border-radius:8px;border:2px solid #4A6A8A;background:#17395A;color:#F4F1EA;font-size:16px}
.hostbar .btn{font-size:17px;padding:12px 18px}
.corner{position:fixed;right:20px;top:20px;background:#fff;padding:8px;border-radius:10px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@400;600&display=swap">
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbz4e9oBETSZ1E2W5HgDCMPa7KP2Uzk7VcQupOLNoCw4yFNaVEXits1yqmRA9E-XT5jb/exec";
var SYM=["▲","◆","●","■"],LET=["A","B","C","D"];
var app=document.getElementById("app"),hash=location.hash.replace("#","");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(h){app.innerHTML='<div class="wrap">'+h+'</div>'}
function pageUrl(){return location.href.split("#")[0]}
function get(q){return fetch(SCRIPT_URL+"?"+q+"&t="+Date.now()).then(function(r){return r.json()})}
function post(o){try{return fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)})}catch(e){}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}}
function qr(el,size){if(el&&window.QRCode)new QRCode(el,{text:pageUrl(),width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}
function err(retry){show('<p class="eyebrow">Quiz żeglarski</p><h1 class="big">Brak połączenia</h1><div class="msg">Nie udało się pobrać quizu. Sprawdź internet i spróbuj ponownie.</div><p><button class="btn" id="rt">Spróbuj ponownie</button></p>');document.getElementById("rt").onclick=retry}
function tilesHtml(q,o){var h='<div class="tiles">';for(var k=0;k<4;k++){var c="tile t"+k+(o.dim&&o.dim[k]?" dim":"")+(o.pick===k?" pick":"");var inner='<span class="sym">'+SYM[k]+'</span>'+esc(q.o[k])+(o.cnt?'<span class="cnt">'+o.cnt[k]+'</span>':"");h+=o.btn?'<button class="'+c+'" data-i="'+k+'"'+(o.off?" disabled":"")+'>'+inner+'</button>':'<div class="'+c+'">'+inner+'</div>'}return h+"</div>"}
function rankHtml(rows,n,max){var h="";rows.slice(0,n).forEach(function(r,k){var w=max?Math.round(100*r.pts/max):0;h+='<div class="rk"><span>'+(k+1)+'.</span><span class="nm"><i style="width:'+w+'%"></i><b>'+esc(r.name)+'</b></span><span class="pt">'+r.pts+' pkt</span></div>'});return h}

/* ---------- Telefon: tryb dowolny ---------- */
function freePlayer(Q,TIME,openStart){
 var i=0,pts=0,good=0,left=TIME,tm=null,t0=0,name=ls("qn"),open=openStart,wt=null;
 function poll(cb){get("action=config").then(function(d){open=Number(d.open)||0;cb&&cb()}).catch(function(){cb&&cb()})}
 function intro(){show('<p class="eyebrow">Quiz żeglarski · Podsumowanie Sezonu 2026</p><h1 class="big">Zagraj na telefonie</h1><p class="sub">'+Q.length+' pytań, '+TIME+' sekund na każde. Im szybciej odpowiesz poprawnie, tym więcej punktów. Bez logowania. Wynik trafi na ekran główny.</p><input class="name" id="nm" maxlength="20" placeholder="Twój pseudonim" value="'+esc(name)+'"><button class="btn" id="go">Start</button>');document.getElementById("go").onclick=start}
 function start(){var v=document.getElementById("nm").value.trim().slice(0,20);if(!v){document.getElementById("nm").focus();return}name=v;ls("qn",name);i=0;pts=0;good=0;poll(next)}
 function next(){clearInterval(wt);if(i>=Q.length){fin();return}if(i>=open)wait();else ask()}
 function send(){post({type:"result",name:name,pts:pts,good:good})}
 function wait(){if(i>0)send();show('<p class="eyebrow">'+(i===0?'Jesteś w grze':'Przerwa w quizie')+'</p><h1 class="big">'+(i===0?'Czekamy na start':'Wracamy do prezentacji')+'</h1><div class="msg">'+(i===0?'Prowadzący uruchomi pierwsze pytania.':'Masz '+pts+' pkt. Kolejne pytania pojawią się tutaj same.')+' Nie zamykaj tej strony.</div>');clearInterval(wt);wt=setInterval(function(){poll(function(){if(i<open)next()})},3000)}
 function ask(){left=TIME;t0=Date.now();var q=Q[i];show('<p class="eyebrow">Pytanie '+(i+1)+' z '+Q.length+'</p><div class="timer" id="tm">'+TIME+' s</div><h1 class="big" style="font-size:clamp(22px,4.5vw,36px)">'+esc(q.q)+'</h1>'+tilesHtml(q,{btn:1}));
  Array.prototype.forEach.call(document.querySelectorAll("button.tile"),function(b){b.onclick=function(){pick(+b.getAttribute("data-i"))}});
  clearInterval(tm);tm=setInterval(function(){left=Math.max(0,TIME-Math.floor((Date.now()-t0)/1000));var e=document.getElementById("tm");if(e)e.textContent=left+" s";if(left<=0)pick(-1)},250)}
 function pick(k){clearInterval(tm);var q=Q[i],el=(Date.now()-t0)/1000,ok=k===q.c,gain=ok?500+Math.round(500*Math.max(0,1-el/TIME)):0;if(ok)good++;pts+=gain;
  var dim=[1,1,1,1];dim[q.c]=0;
  show('<p class="eyebrow">Pytanie '+(i+1)+' z '+Q.length+'</p><h1 class="big" style="font-size:clamp(22px,4.5vw,36px)">'+esc(q.q)+'</h1>'+tilesHtml(q,{dim:dim,pick:k}));
  app.querySelector(".wrap").insertAdjacentHTML("beforeend",'<div class="msg">'+(k<0?'<span class="bad">Czas minął.</span>':ok?'<span class="ok">Dobrze!</span>':'<span class="bad">Niestety, źle.</span>')+' +'+gain+' pkt, razem '+pts+' pkt.</div><p><button class="btn" id="nx" style="margin-top:20px">'+(i+1>=Q.length?"Zobacz wynik":"Dalej")+'</button></p>');
  document.getElementById("nx").onclick=function(){i++;next()}}
 function fin(){send();show('<p class="eyebrow">Koniec quizu</p><h1 class="big">'+esc(name)+', twój wynik: '+pts+' pkt</h1><div class="msg">Poprawnych odpowiedzi: '+good+' z '+Q.length+'. Dziękujemy za grę!</div><p><button class="btn ghost" id="again" style="margin-top:20px">Zagraj jeszcze raz</button></p>');document.getElementById("again").onclick=intro}
 intro()}

/* ---------- Telefon: tryb na żywo ---------- */
function livePlayer(){
 var name=ls("qn"),joined=false,st=null,off=0,ans={},lastSig="";
 function key(){return st.game+"|"+st.i}
 function load(){try{ans=JSON.parse(ls("ans")||"{}")}catch(e){ans={}}}
 function saveAns(){ls("ans",JSON.stringify(ans))}
 function nameScreen(){show('<p class="eyebrow">Quiz żeglarski · na żywo</p><h1 class="big">Podaj pseudonim</h1><input class="name" id="nm" maxlength="20" placeholder="Twój pseudonim" value="'+esc(name)+'"><button class="btn" id="go">Dołącz</button>');document.getElementById("go").onclick=function(){var v=document.getElementById("nm").value.trim().slice(0,20);if(!v){document.getElementById("nm").focus();return}name=v;ls("qn",name);ls("joined",name);joined=true;post({type:"join",name:name});lastSig="";draw()}}
 function remaining(){return Math.max(0,st.time-Math.floor((Date.now()+off-st.startedAt)/1000))}
 function draw(){
  if(!joined){nameScreen();return}
  if(!st){show('<p class="sub">Łączenie…</p>');return}
  var a=ans[key()],sig=[st.phase,st.i,st.game,a,st.me&&st.me.pts].join("|");if(sig===lastSig)return;lastSig=sig;
  var h="",q=st.q;
  if(st.phase==="lobby")h='<p class="eyebrow">Jesteś w grze</p><h1 class="big">Cześć, '+esc(name)+'!</h1><div class="msg">Czekamy na start. Patrz na ekran główny.</div>';
  else if(st.phase==="question"){var over=remaining()<=0;
   h='<p class="eyebrow">Pytanie '+(st.i+1)+' z '+st.n+'</p><div class="timer" id="tm">'+remaining()+' s</div>';
   if(st.phone==="buttons"){h+='<div class="btns">';for(var k=0;k<4;k++)h+='<button class="bigbtn t'+k+(a===k?" pick":"")+'" data-i="'+k+'"'+((a!==undefined||over)?" disabled":"")+'>'+SYM[k]+'</button>';h+="</div>"}
   else h+='<h1 class="big" style="font-size:clamp(22px,4.5vw,36px)">'+esc(q.q)+'</h1>'+tilesHtml(q,{btn:1,off:(a!==undefined||over),pick:a});
   if(a!==undefined)h+='<div class="msg">Odpowiedź zapisana. Czekamy na pozostałych.</div>'}
  else if(st.phase==="reveal"){var l=st.last,good=l&&l.ok;
   h='<p class="eyebrow">Pytanie '+(st.i+1)+' z '+st.n+'</p><h1 class="big" style="font-size:clamp(24px,5vw,40px)">'+(l?(good?'<span class="ok">Dobrze!</span>':'<span class="bad">Niestety, źle.</span>'):'<span class="bad">Brak odpowiedzi.</span>')+'</h1><div class="msg">Poprawna odpowiedź: <b>'+LET[q.c]+'. '+esc(q.o[q.c])+'</b>'+(l?'<br>Za to pytanie: +'+l.pts+' pkt.':'')+(st.me?'<br>Razem '+st.me.pts+' pkt, miejsce '+st.me.place+' z '+st.me.of+'.':'')+'</div>'}
  else if(st.phase==="ranking")h='<p class="eyebrow">Ranking</p><h1 class="big">'+(st.me?'Miejsce '+st.me.place+' z '+st.me.of:'Ranking')+'</h1><div class="msg">'+(st.me?'Masz '+st.me.pts+' pkt. ':'')+'Sprawdź ranking na ekranie głównym.</div>';
  else h='<p class="eyebrow">Koniec quizu</p><h1 class="big">'+(st.me?'Twój wynik: '+st.me.pts+' pkt':'Koniec quizu')+'</h1><div class="msg">'+(st.me?'Miejsce '+st.me.place+' z '+st.me.of+'. ':'')+'Dziękujemy za grę!</div>';
  show(h);
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.onclick=function(){answer(+b.getAttribute("data-i"))}})}
 function answer(k){if(!st||st.phase!=="question"||ans[key()]!==undefined||remaining()<=0)return;ans[key()]=k;saveAns();post({type:"answer",name:name,i:st.i,choice:k,ms:Date.now()+off-st.startedAt});lastSig="";draw()}
 function tick(){get("action=state&name="+encodeURIComponent(name)).then(function(d){off=d.now-Date.now();st=d;draw()}).catch(function(){})}
 setInterval(function(){var e=document.getElementById("tm");if(e&&st&&st.phase==="question"){e.textContent=remaining()+" s";if(remaining()<=0){lastSig="";draw()}}},300);
 load();
 if(name&&ls("joined")===name)joined=true;
 draw();tick();setInterval(tick,2000);
 if(joined)post({type:"join",name:name})}

/* ---------- Ekran na telewizor ---------- */
function tvPage(){
 document.body.className="host";
 var st=null,off=0,lastSig="",auto={},pin=ls("pin");
 function cmd(c){post({type:"host",cmd:c,pin:document.getElementById("pin")?document.getElementById("pin").value:pin});setTimeout(tick,700)}
 function remaining(){return Math.max(0,st.time-Math.floor((Date.now()+off-st.startedAt)/1000))}
 function bar(){var b="";var p=st.phase;
  if(st.mode!=="live")return"";
  b='<div class="hostbar"><input id="pin" type="password" placeholder="PIN" value="'+esc(pin)+'">';
  if(p==="lobby")b+='<button class="btn" data-c="start">Start gry</button>';
  if(p==="question")b+='<button class="btn" data-c="reveal">Pokaż odpowiedź</button>';
  if(p==="reveal")b+='<button class="btn" data-c="ranking">Ranking</button><button class="btn" data-c="next">'+(st.i+1>=st.n?"Wynik końcowy":"Następne pytanie")+'</button>';
  if(p==="ranking")b+='<button class="btn" data-c="next">'+(st.i+1>=st.n?"Wynik końcowy":"Następne pytanie")+'</button>';
  b+='<button class="btn ghost" data-c="reset">Nowa gra (reset)</button></div>';return b}
 function draw(){
  if(!st){show('<p class="sub">Łączenie…</p>');return}
  var sig=JSON.stringify([st.mode,st.phase,st.i,st.game,st.joined,st.answered,st.dist,st.rank,st.names,st.freerank]);if(sig===lastSig)return;lastSig=sig;
  var h="",q=st.q,p=st.phase;
  if(st.mode!=="live"){
   var fr=st.freerank||[],mx=fr.length?fr[0].pts:0;
   h='<p class="eyebrow">Quiz żeglarski · Podsumowanie Sezonu 2026</p><h1 class="big">Zagraj telefonem</h1><div class="lobby"><div><div class="qr" id="qr"></div></div><div><p class="sub">Zeskanuj kod aparatem. Bez logowania, w dowolnym momencie.</p><h2 style="margin-top:28px;font-size:36px">Najlepsze wyniki</h2>'+(fr.length?rankHtml(fr,10,mx):'<p class="sub">Czekamy na pierwszych graczy.</p>')+'</div></div>'}
  else if(p==="lobby")h='<p class="eyebrow">Quiz żeglarski · na żywo</p><h1 class="big">Dołącz telefonem</h1><div class="lobby"><div><div class="qr" id="qr"></div></div><div><p class="sub">Zeskanuj kod aparatem, wpisz pseudonim i czekaj na pierwsze pytanie.</p><p class="sub">Dołączyło: <b>'+(st.joined||0)+'</b></p><div class="row" style="margin-top:20px">'+(st.names||[]).map(function(n){return'<span class="chip">'+esc(n)+'</span>'}).join("")+'</div></div></div>';
  else if(p==="question")h='<div class="row" style="justify-content:space-between"><p class="eyebrow">Pytanie '+(st.i+1)+' z '+st.n+(q&&q.cat?' · '+esc(q.cat):'')+'</p><div class="timer" id="tm">'+remaining()+'</div></div><h1 class="big">'+esc(q.q)+'</h1>'+tilesHtml(q,{})+'<p class="sub">Odpowiedziało: '+(st.answered||0)+' z '+(st.joined||0)+'</p>';
  else if(p==="reveal"){var dim=[1,1,1,1];dim[q.c]=0;var r3=(st.rank||[]).slice(0,3);
   h='<p class="eyebrow">Pytanie '+(st.i+1)+' z '+st.n+' · poprawna odpowiedź: '+LET[q.c]+'</p><h1 class="big">'+esc(q.q)+'</h1>'+tilesHtml(q,{dim:dim,cnt:st.dist||[0,0,0,0]})+'<h2 style="margin-top:30px;font-size:36px">Najlepsza trójka</h2>'+rankHtml(r3,3,r3.length?r3[0].pts:0)}
  else{var rk=st.rank||[];h='<p class="eyebrow">'+(p==="final"?"Koniec quizu":"Ranking po pytaniu "+(st.i+1))+'</p><h1 class="big">'+(p==="final"?"Wyniki końcowe":"Najlepsi gracze")+'</h1>'+rankHtml(rk,10,rk.length?rk[0].pts:0)}
  show(h+(st.mode==="live"?'<div style="height:90px"></div>':""));
  var qe=document.getElementById("qr");if(qe)qr(qe,380);
  app.insertAdjacentHTML("beforeend",bar());
  Array.prototype.forEach.call(document.querySelectorAll("[data-c]"),function(b){b.onclick=function(){var c=b.getAttribute("data-c");if(c==="reset"&&!confirm("Zacząć nową grę? Obecne wyniki zostaną usunięte."))return;pin=document.getElementById("pin").value;ls("pin",pin);cmd(c)}})}
 function tick(){get("action=state&full=1").then(function(d){off=d.now-Date.now();st=d;draw()}).catch(function(){})}
 setInterval(function(){if(!st)return;var e=document.getElementById("tm");if(e&&st.phase==="question"){e.textContent=remaining();
   if(remaining()<=0&&pin&&!auto[st.game+st.i]){auto[st.game+st.i]=1;post({type:"host",cmd:"reveal",pin:pin});setTimeout(tick,700)}}},300);
 draw();tick();setInterval(tick,1500)}

/* ---------- Start ---------- */
function boot(){
 if(hash==="tv"){tvPage();return}
 if(hash==="qr"){document.body.className="host";show('<p class="eyebrow">Quiz żeglarski · Podsumowanie Sezonu 2026</p><h1 class="big">Zeskanuj i zagraj</h1><div class="lobby"><div><div class="qr" id="qr"></div></div><div><p class="sub">Aparat telefonu otwiera quiz bez logowania.</p><p class="sub">'+esc(pageUrl())+'</p></div></div>');qr(document.getElementById("qr"),380);return}
 show('<p class="sub">Ładowanie quizu…</p>');
 get("action=config").then(function(c){
  if(c.mode==="live"){livePlayer();return}
  get("action=questions").then(function(d){
   if(!d.questions||!d.questions.length){show('<p class="eyebrow">Quiz żeglarski</p><h1 class="big">Brak pytań</h1>');return}
   freePlayer(d.questions,d.time||20,Number(d.open)||0)}).catch(function(){err(boot)})
 }).catch(function(){err(boot)})}
boot();
</script>
</body>
</html>
